services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      - phoenix
    restart: unless-stopped
  phoenix:
    image: arizephoenix/phoenix:latest  # must be >= 4.0
    ports:
      - "6006:6006"   # UI / OTLP HTTP
      - "4317:4317"   # OTLP gRPC
      - "9090:9090"   # optional: Prometheus metrics
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data

volumes:
  phoenix_data:
    driver: local